<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerador de LUT Personalizada</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Gerador de LUT Personalizada</h1>
      <p>Envie uma foto, deixe a IA analisar e baixe sua LUT .CUBE.</p>

      <form id="upload-form">
        <input id="photo" type="file" accept="image/*" required />
        <button type="submit">Gerar LUT</button>
      </form>

      <section id="analysis" class="card hidden"></section>
      <a id="download" class="download hidden" download="lut_personalizada.cube">Baixar LUT .CUBE</a>
      <p id="status"></p>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
